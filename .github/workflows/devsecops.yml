name: DevSecOps Pipeline

on:
  push:
    branches: ["**"]
  pull_request:
    branches: [main]
  schedule:
    - cron: "0 5 * * 1" # lunes 05:00 UTC — detecta CVEs nuevos en dependencias ya instaladas

permissions:
  contents: read

jobs:
  dependency-audit:
    name: Auditoría de dependencias (pnpm audit)
    runs-on: ubuntu-latest
    steps:
      - name: Descargar el código
        uses: actions/checkout@v5

      - name: Configurar pnpm
        uses: pnpm/action-setup@v4

      - name: Configurar Node.js 22
        uses: actions/setup-node@v5
        with:
          node-version: "22"
          cache: "pnpm"

      - name: Instalar dependencias
        run: pnpm install --frozen-lockfile

      - name: Auditar dependencias (pnpm audit)
        run: |
          set +e
          pnpm audit --json > audit.json
          exit_code=$?
          echo "## pnpm audit" >> "$GITHUB_STEP_SUMMARY"
          pnpm audit >> "$GITHUB_STEP_SUMMARY" 2>&1 || true
          set -e
          exit $exit_code

      - name: Subir reporte de auditoría (Artifact)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: reporte-pnpm-audit
          path: audit.json
          retention-days: 7
          if-no-files-found: warn

  sast:
    name: Escaneo de código (Semgrep SAST)
    runs-on: ubuntu-latest
    steps:
      - name: Descargar el código
        uses: actions/checkout@v5

      - name: Configurar Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Instalar Semgrep
        run: |
          python -m pip install --upgrade pip
          pip install semgrep

      - name: Escanear código (Semgrep — reporte completo, no bloquea)
        run: |
          semgrep scan \
            --config=p/security-audit --config=p/typescript --config=p/react \
            --json --output=semgrep.json \
            src/ api/ supabase/functions/ || true

      - name: Subir reporte de Semgrep (Artifact)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: reporte-semgrep
          path: semgrep.json
          retention-days: 7
          if-no-files-found: warn

      - name: Escanear código (Semgrep — bloquea solo hallazgos ERROR)
        run: |
          semgrep scan \
            --config=p/security-audit --config=p/typescript --config=p/react \
            --severity=ERROR \
            src/ api/ supabase/functions/

  secret-scan:
    name: Escaneo de secretos (Gitleaks)
    runs-on: ubuntu-latest
    steps:
      - name: Descargar el código (con historial completo)
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Configurar Go
        uses: actions/setup-go@v5
        with:
          go-version: "stable"

      # El binario de Gitleaks (OSS) es gratis siempre. La Action wrapper
      # gitleaks/gitleaks-action@v2 exige licencia paga para cuentas de
      # organización (no para cuentas personales) desde su cambio de licencia —
      # instalamos el CLI directo para no depender de esa licencia.
      - name: Instalar Gitleaks (CLI OSS, sin licencia)
        run: go install github.com/gitleaks/gitleaks/v8@latest

      - name: Escanear secretos en todo el historial de git
        run: gitleaks detect --source . --verbose --redact

  quality-gate:
    name: Type-check, tests y lint
    runs-on: ubuntu-latest
    steps:
      - name: Descargar el código
        uses: actions/checkout@v5

      - name: Configurar pnpm
        uses: pnpm/action-setup@v4

      - name: Configurar Node.js 22
        uses: actions/setup-node@v5
        with:
          node-version: "22"
          cache: "pnpm"

      - name: Instalar dependencias
        run: pnpm install --frozen-lockfile

      - name: Type-check (tsc)
        run: pnpm exec tsc -b

      - name: Tests (Vitest)
        run: pnpm test

      - name: Lint (Oxlint)
        run: pnpm run lint
