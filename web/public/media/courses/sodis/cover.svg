<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 360">
  <rect width="640" height="360" fill="#FFB793" />
  <rect x="6" y="6" width="628" height="348" fill="none" stroke="#1c1c11" stroke-width="4" />
  <!-- Sol con rayos -->
  <circle cx="150" cy="110" r="46" fill="#fdfae7" stroke="#1c1c11" stroke-width="4" />
  <g stroke="#1c1c11" stroke-width="4" stroke-linecap="round">
    <line x1="150" y1="34" x2="150" y2="10" />
    <line x1="150" y1="186" x2="150" y2="162" />
    <line x1="66" y1="110" x2="42" y2="110" />
    <line x1="258" y1="110" x2="234" y2="110" />
    <line x1="90" y1="50" x2="74" y2="34" />
    <line x1="210" y1="50" x2="226" y2="34" />
  </g>
  <!-- Rayos UV hacia la botella -->
  <g stroke="#1c1c11" stroke-width="3" stroke-dasharray="6 6">
    <line x1="185" y1="140" x2="330" y2="230" />
    <line x1="200" y1="120" x2="360" y2="215" />
  </g>
  <!-- Techo de calamina -->
  <path d="M40 300 Q 90 285 140 300 T 240 300 T 340 300 T 440 300 T 540 300 T 600 300" fill="none" stroke="#1c1c11" stroke-width="4" />
  <rect x="30" y="300" width="580" height="46" fill="#99B4D8" stroke="#1c1c11" stroke-width="4" />
  <!-- Botella PET -->
  <g>
    <rect x="330" y="215" width="46" height="90" rx="10" fill="#fdfae7" stroke="#1c1c11" stroke-width="4" />
    <rect x="344" y="196" width="18" height="24" fill="#fdfae7" stroke="#1c1c11" stroke-width="4" />
    <rect x="336" y="245" width="34" height="52" fill="#99B4D8" opacity="0.75" />
  </g>
  <text x="320" y="60" font-family="'Plus Jakarta Sans', system-ui, sans-serif" font-size="30" font-weight="800" fill="#1c1c11" text-anchor="middle">SODIS: 6h de sol de Piura</text>
</svg>
