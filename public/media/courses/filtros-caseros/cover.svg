<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 360">
  <rect width="640" height="360" fill="#E26D5C" />
  <rect x="6" y="6" width="628" height="348" fill="none" stroke="#1c1c11" stroke-width="4" />
  <!-- Frasco cortado con capas -->
  <g>
    <rect x="250" y="70" width="140" height="230" fill="#fdfae7" stroke="#1c1c11" stroke-width="4" />
    <!-- agua turbia entrando arriba -->
    <rect x="250" y="70" width="140" height="30" fill="#8a5a2e" opacity="0.6" />
    <!-- algodón -->
    <rect x="250" y="100" width="140" height="26" fill="#fdfae7" stroke="#1c1c11" stroke-width="2" />
    <!-- carbón -->
    <rect x="250" y="126" width="140" height="34" fill="#1c1c11" />
    <!-- arena fina -->
    <rect x="250" y="160" width="140" height="40" fill="#e6c98a" stroke="#1c1c11" stroke-width="2" />
    <!-- arena gruesa -->
    <rect x="250" y="200" width="140" height="40" fill="#c99a53" stroke="#1c1c11" stroke-width="2" />
    <!-- grava -->
    <rect x="250" y="240" width="140" height="60" fill="#9c9c9c" stroke="#1c1c11" stroke-width="2" />
  </g>
  <!-- vaso con agua cristalina -->
  <path d="M290 310 L 300 350 L 350 350 L 360 310 Z" fill="#99B4D8" stroke="#1c1c11" stroke-width="4" />
  <text x="320" y="45" font-family="'Plus Jakarta Sans', system-ui, sans-serif" font-size="26" font-weight="800" fill="#fdfae7" text-anchor="middle">Filtro casero: grava→arena→carbón</text>
</svg>
